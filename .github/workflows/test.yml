# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Acceptance tests create real resources in a shared Kinde business, so pull
  # requests that only touch docs, examples or repo metadata skip them.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      acceptance: ${{ steps.filter.outputs.acceptance }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The pull request merge commit and its base parent.
          fetch-depth: 2
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "acceptance=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"

          if grep -qE '^(main\.go$|go\.(mod|sum)$|internal/|\.github/workflows/test\.yml$)' <<< "$changed"; then
            echo "acceptance=true" >> "$GITHUB_OUTPUT"
          else
            echo "acceptance=false" >> "$GITHUB_OUTPUT"
          fi

  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A new push to a pull request supersedes the previous build.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-generate-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # Temporarily download Terraform 1.8 prerelease for function documentation support.
      # When Terraform 1.8.0 final is released, this can be removed.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.8.0-alpha20240216'
          terraform_wrapper: false
      - run: cd tools && go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'cd tools && go generate ./...' and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs: [changes, build]
    if: needs.changes.outputs.acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every branch shares one Kinde business, so only one suite runs at a time
    # across the whole repository. In-progress runs are never cancelled, as that
    # would leave test resources behind in the business.
    concurrency:
      group: kinde-acceptance-tests
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # Each job runs the full suite against the same business.
      max-parallel: 1
      matrix:
        # Pull requests test the current release; main also tests the oldest
        # supported version.
        terraform: ${{ fromJSON(github.event_name == 'pull_request' && '["latest"]' || '["1.0.*", "latest"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: '1'
          KINDE_DOMAIN: ${{ secrets['KINDE_DOMAIN'] }}
          KINDE_AUDIENCE: ${{ secrets['KINDE_AUDIENCE'] }}
          KINDE_CLIENT_ID: ${{ secrets['KINDE_CLIENT_ID'] }}
          KINDE_CLIENT_SECRET: ${{ secrets['KINDE_CLIENT_SECRET'] }}
        run: |
          missing=0
          for var in KINDE_DOMAIN KINDE_AUDIENCE KINDE_CLIENT_ID KINDE_CLIENT_SECRET; do
            if [ -z "${!var}" ]; then
              echo "Skipping acceptance tests: $var is not configured in GitHub secrets."
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            exit 0
          fi

          go test -v -cover ./internal/provider/
        timeout-minutes: 10
